# Production override — apply alongside docker-compose.yml
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  # postgres + redis run as Docker-network-only containers (no host port),
  # defined in the base docker-compose.yml. The overrides below only take
  # away its dev-password fallbacks: in production a missing
  # POSTGRES_PASSWORD / REDIS_PASSWORD stops `docker compose up` with an
  # error instead of silently running on thanos_dev_secret /
  # redis_dev_secret. (The api / indexer / worker URLs are built from the
  # same variables, so they can't fall back either once these are set.)
  #
  # A box whose .env never set POSTGRES_PASSWORD: its database was
  # initialised with thanos_dev_secret, and Postgres reads
  # POSTGRES_PASSWORD only on first init. Put POSTGRES_PASSWORD=
  # thanos_dev_secret in .env so the services can still log in, then rotate:
  #   docker exec -it thanos-postgres psql -U thanos -c "ALTER USER thanos PASSWORD '<new>'"
  # and set the new value in .env. Redis takes its password from the
  # command line, so a new REDIS_PASSWORD applies on the next `up`.
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the VPS .env (see docker-compose.prod.yml)}

  redis:
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in the VPS .env (see docker-compose.prod.yml)}
      --appendonly yes
      --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in the VPS .env}", "ping"]

  api:
    environment:
      NODE_ENV: production
      # Shared secret gating the internal /push/notify endpoint (indexer →
      # api). Push delivery to devices is DISABLED until this is set in the
      # VPS .env (generate: openssl rand -hex 32).
      PUSH_INTERNAL_SECRET: ${PUSH_INTERNAL_SECRET:-}
      # LAX card partner API (server-side proxy, see services/api/routes/lax.ts).
      # Secret — set in the VPS .env, never in the repo. The /lax proxy stays
      # in safe external-registration fallback until LAX_API_BASE is set;
      # issuance also needs widget/product IDs; webhooks need the shared secret.
      LAX_API_KEY:         ${LAX_API_KEY:-}
      LAX_API_BASE:        ${LAX_API_BASE:-}
      LAX_PROJECT_ID:      ${LAX_PROJECT_ID:-612}
      # Native card issuance (issue-card-api). iFrame 13524 = global widget
      # "LAX Card Main" (confirmed by Zypto 2026-09-27). PRODUCT_ID comes from
      # GET /lax/products (Zypto get-products) — set it in the VPS .env.
      LAX_IFRAME_ID:       ${LAX_IFRAME_ID:-13524}
      LAX_PRODUCT_ID:      ${LAX_PRODUCT_ID:-}
      LAX_WEBHOOK_SECRET:  ${LAX_WEBHOOK_SECRET:-}
      INDEXER_URL:         ${INDEXER_URL:-http://indexer:4010}
    # Remove dev volume mount — use built image only
    volumes: []
    # Expose only on localhost; use nginx reverse proxy in front for SSL
    # Port 4100 instead of 4000 to avoid conflict with stuck proxies
    ports:
      - "127.0.0.1:4100:4000"

  indexer:
    environment:
      NODE_ENV: production
      # Same secret as the api service — the indexer's notifyReceive() is a
      # silent no-op without it (that's why incoming-funds pushes never fired).
      PUSH_INTERNAL_SECRET: ${PUSH_INTERNAL_SECRET:-}
      # Internal Docker-network URL the indexer calls to fan out pushes.
      PUSH_API_URL: http://api:4000
    # Published on localhost only — nginx proxies /indexer/ to it, and
    # the web app calls /indexer for portfolio / token data.
    ports:
      - "127.0.0.1:4010:4010"

  worker:
    environment:
      NODE_ENV: production

  # ─── Web app (Next.js wallet UI) ───────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* vars are read by Next.js during `next build` and
      # inlined into the client bundle — they MUST be passed as build
      # args, not just runtime env, or the browser sees `undefined`.
      # That's how the Permissions screen got its "NEXT_PUBLIC_REOWN_
      # PROJECT_ID is not set" banner: the value was in .env but the
      # build never saw it. Source-of-truth values live in the VPS .env
      # file alongside this compose; pnpm-version'd defaults below keep
      # local docker compose up working when the var isn't set.
      args:
        NEXT_PUBLIC_API_URL:          ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_REOWN_PROJECT_ID: ${NEXT_PUBLIC_REOWN_PROJECT_ID:-}
        NEXT_PUBLIC_INDEXER_URL:      ${NEXT_PUBLIC_INDEXER_URL:-/indexer}
        NEXT_PUBLIC_MULTX_API_URL:    ${NEXT_PUBLIC_MULTX_API_URL:-https://bridge.litho.ai}
    container_name: thanos-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Public URL the client uses to call the API. Set in .env to your domain.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    # Localhost-only — nginx will reverse proxy to it
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # Slim Next.js image doesn't have wget — use node's http module instead
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
