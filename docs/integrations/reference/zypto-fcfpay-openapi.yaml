            text/plain:
              schema:
                type: string
                example: "{\n     'success': false,\n     'message' => 'Something went wrong!',\n}"
      tags:
        - 'Physical cards api'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                card_holder_id:
                  type: string
                  description: ''
