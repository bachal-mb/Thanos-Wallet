          content:
            text/plain:
              schema:
                type: string
                example: "{\n     'success': false,\n     'message' => 'Something went wrong!',\n}"
      tags:
        - 'Physical cards api'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                card_number:
                  type: string
                  description: ''
                  example: vitae
                PIN:
                  type: string
                  description: ''
                  example: molestiae
              required:
                - card_number
                - PIN
      security: []
  /api/physical-cards/get-pin:
    post:
      summary: 'Get Pin'
      operationId: getPin
      description: 'This API call will return the PIN of a physical EUR Card.'
      parameters:
        -
          in: header
          name: Authorization
          description: ''
          example: 'Bearer 5ScRiAOgI5BlgdjSwWNUbNagsj8fFCjady'
