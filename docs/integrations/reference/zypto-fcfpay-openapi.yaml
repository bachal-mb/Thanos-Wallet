          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n     'success': true,\n     'message' => 'Submit successfully',\n     'data' => response data\n}"
        401:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n     'success': false,\n     'message' => 'Something went wrong!',\n}"
      tags:
        - 'Physical cards api'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                card_holder_id:
                  type: string
                  description: ''
                  example: qui
              required:
                - card_holder_id
      security: []
  /api/physical-cards/assign-bulk-card:
    post:
      summary: 'Assign Bulk Card'
      operationId: assignBulkCard
      description: 'This API call will assign a bulk plastic card to a Card Holder.'
      parameters:
        -
          in: header
          name: Authorization
          description: ''
          example: 'Bearer 5ScRiAOgI5BlgdjSwWNUbNagsj8fFCjady'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n     'success': true,\n     'message' => response api data\n}"
        401:
          description: ''
