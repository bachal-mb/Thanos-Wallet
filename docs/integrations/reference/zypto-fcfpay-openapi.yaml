  /api/physical-cards/get-transactions-current-month:
    post:
      summary: 'Get Transactions Current Month'
      operationId: getTransactionsCurrentMonth
      description: 'This API call will return the transactions list for the specified card.'
      parameters:
        -
          in: header
          name: Authorization
          description: ''
          example: 'Bearer 5ScRiAOgI5BlgdjSwWNUbNagsj8fFCjady'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n     'success': true,\n     'message' => [\n         {\n             \"terminal_owner_country\": \"NA\",\n             \"base_currency\": \"840\",\n             \"terminal_type\": \"NA\",\n             \"approval_code\": \"000001\",\n             \"processing_currency\": \"840\",\n             \"card_number\": \"420849******8678\",\n             \"terminal_currency\": \"840\",\n             \"terminal_amount\": \"10.0\",\n             \"debit_credit\": \"card_to_card_transfer_money\",\n             \"type\": \"card_to_card_transfer_money\",\n             \"is_reversal\": \"NA\",\n             \"result\": \"\",\n             \"txn_id\": \"NA\",\n             \"card_holder\": \"Cardholdername\",\n             \"processing_amount\": \"+10.0\",\n             \"card_token\": \"2000001835018350\",\n             \"iso_fee\": \"\",\n             \"base_amount\": \"+10.0\",\n             \"transaction_state\": \"Settled\",\n             \"time\": \"27/01/2023\",\n             \"terminal_owner_title\": \"NA\",\n             \"cardholder_fee\": \"\",\n             \"terminal_id\": \"\"\n         }\n     ]\n}"
        401:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n     'success': false,\n     'message' => 'Something went wrong!',\n}"
      tags:
        - 'Physical cards api'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                card_number:
                  type: string
                  description: ''
                  example: voluptatem
              required:
