  /api/physical-cards/holder-address:
    post:
      summary: 'Holder KYC - Add Proof of Address'
      operationId: holderKYCAddProofOfAddress
      description: "This API call will submit the proof of address documents for a cardholder.\n\n Please use one of the accepted document types to avoid delays and cardholder application rejections.\n\n address_type_Id values:\n\nCredit Card Statement = 0, Utility Bill = 1, Bank Statement = 2, Bank Letter = 3\n\naddress_IssuedBy value: 2 letter ISO country code\n\naddress_IssuedDate format: YYYY-MM-DD\n\n address_LangId values:\n\nEnglish = 0, Spanish = 1, French = 2, Arabic = 3, Chinese = 4, Japanese = 5, Russian = 6, Portuguese = 7, German = 8, Italian = 9, Hindi = 10, Other = 11\n\nEndFragmentStartFragment\n\naddress_FrontSide & address_BackSide : BASE64 encoded graphics"
      parameters:
        -
          in: header
          name: Authorization
          description: ''
          example: 'Bearer 5ScRiAOgI5BlgdjSwWNUbNagsj8fFCjady'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n     'success': true,\n     'message' => 'KYC documents sent successfully',\n     'data' => response api data\n}"
        401:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n     'success': false,\n     'message' => 'Something went wrong!',\n}"
      tags:
        - 'Physical cards api'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cardHolderID:
                  type: string
                  description: ''
                  example: culpa
                address_TypeId:
                  type: string
                  description: ''
                  example: explicabo
                address_IssuedBy:
                  type: string
                  description: ''
                  example: natus
                address_IssuedDate:
                  type: string
                  description: ''
                  example: ut
                address_LangId:
                  type: string
                  description: ''
                  example: nesciunt
                address_FrontSide:
                  type: string
                  description: ''
                  example: minus
                address_BackSide:
                  type: string
                  description: ''
                  example: nam
              required:
                - cardHolderID
                - address_TypeId
                - address_IssuedBy
                - address_IssuedDate
                - address_LangId
                - address_FrontSide
                - address_BackSide
      security: []
  /api/physical-cards/holder-id-document:
    post:
      summary: 'Holder KYC - Add ID Document'
      operationId: holderKYCAddIDDocument
      description: "This API call will submit the proof of ID documents for a cardholder\n\n\nidNumber - Document number\n\nidIssuedBy value- 2 letter ISO country code\n\nIdExpDate format - YYYY-MM-DD\n\nidIssueDate format - YYYY-MM-DD\n\nidType: Passport = 0, Driver License = 1, National Id = 2\n\nidDocLang: English = 0, Spanish = 1, French = 2, Arabic = 3, Chinese = 4, Japanese = 5, Russian = 6, Portuguese = 7, German = 8, Italian = 9, Hindi = 10, Other = 11\n\nid_FrontSide & id_BackSide - BASE64 encoded graphics"
      parameters:
        -
          in: header
          name: Authorization
          description: ''
          example: 'Bearer 5ScRiAOgI5BlgdjSwWNUbNagsj8fFCjady'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n     'success': true,\n     'message' => 'ID documents sent successfully',\n     'data' => response api data\n}"
        401:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n     'success': false,\n     'message' => 'Something went wrong!',\n}"
      tags:
        - 'Physical cards api'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cardHolderID:
                  type: string
                  description: ''
                  example: et
                idNumber:
                  type: string
                  description: ''
                  example: aut
                idIssuedBy:
                  type: string
                  description: ''
                  example: accusamus
                idExpDate:
                  type: string
                  description: ''
                  example: at
                idIssueDate:
                  type: string
                  description: ''
                  example: cum
                idType:
                  type: string
                  description: ''
                  example: consequatur
                idDocLang:
                  type: string
                  description: ''
                  example: odio
                id_FrontSide:
                  type: string
                  description: ''
                  example: sunt
                id_BackSide:
                  type: string
                  description: ''
                  example: temporibus
              required:
                - cardHolderID
                - idNumber
                - idIssuedBy
                - idExpDate
                - idIssueDate
                - idType
                - idDocLang
                - id_FrontSide
                - id_BackSide
      security: []
  /api/physical-cards/load:
