      summary: 'Set Pin'
      operationId: setPin
      description: 'This API call will change the PIN of a card.'
      parameters:
        -
          in: header
          name: Authorization
          description: ''
          example: 'Bearer 5ScRiAOgI5BlgdjSwWNUbNagsj8fFCjady'
