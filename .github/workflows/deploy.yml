name: website-cd

# Auto-deploys the web container to the VPS on every push to main, after
# CI has gone green. Pulls the repo on the VPS over SSH, rebuilds the web
# image, restarts only the web service.
#
# Requires three GitHub Actions secrets to be configured:
#   VPS_SSH_HOST       — IP or hostname (e.g. 76.13.250.159)
#   VPS_SSH_USER       — typically 'root' or a dedicated deploy user
#   VPS_SSH_PRIVATE_KEY — full PEM content of the private key with VPS access

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/api-client/**"
      - "packages/sdk-core/**"
      - "packages/sdk-react/**"
      - "packages/ui/**"
      - "vendor/**"
      - "apps/web/Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  validate-web:
    name: validate website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck website
        run: pnpm --filter @thanos/web typecheck
        env:
          NEXT_PUBLIC_LITHO_RPC: https://rpc.litho.ai
          NEXT_PUBLIC_REOWN_PROJECT_ID: ${{ vars.NEXT_PUBLIC_REOWN_PROJECT_ID || '6d05d9a84112ca2f7c1bb77a76a18c81' }}
          NEXT_PUBLIC_MULTX_API_URL: https://bridge.litho.ai

      - name: Test website
        run: pnpm --filter @thanos/web test

      - name: Build website
        run: pnpm --filter @thanos/web build
        env:
          NEXT_PUBLIC_LITHO_RPC: https://rpc.litho.ai
          NEXT_PUBLIC_REOWN_PROJECT_ID: ${{ vars.NEXT_PUBLIC_REOWN_PROJECT_ID || '6d05d9a84112ca2f7c1bb77a76a18c81' }}
          NEXT_PUBLIC_MULTX_API_URL: https://bridge.litho.ai

  deploy-web:
    name: pull + rebuild web on VPS
    needs: validate-web
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 15
    environment: production

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull + rebuild + restart website
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            'set -e
             cd /var/www/thanos-wallet
             git pull --ff-only origin main
             docker compose -f docker-compose.yml -f docker-compose.prod.yml build web
             docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d web
             docker compose -f docker-compose.yml -f docker-compose.prod.yml ps web'

      - name: Smoke-check
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS -m 10 "https://thanos.fi/" >/dev/null; then
              echo "✓ thanos.fi is up"
              exit 0
            fi
            echo "waiting for site… ($i/5)"
            sleep 10
          done
          echo "✗ site did not respond"
          exit 1
