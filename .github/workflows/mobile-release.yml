name: mobile-release

# Build + submit the Expo mobile app to the App Store and Play Store.
#
# Triggers:
#   • push a tag matching mobile-v*  (e.g. mobile-v1.0.0) → build + submit
#   • manual dispatch with a platform + whether to submit
#
# All heavy lifting runs on EAS (Expo's cloud builders), so this job is a
# thin orchestrator — it doesn't need macOS runners.
#
# Required repository secrets:
#   EXPO_TOKEN                    — Expo access token (expo.dev → Account →
#                                   Access tokens). Lets eas-cli auth headless.
#   ASC_API_KEY_BASE64            — base64 of the App Store Connect .p8 key
#   ASC_APPLE_ID                  — Apple ID email of the publishing account
#   ASC_APP_ID                    — numeric App Store app id
#   APPLE_TEAM_ID                 — 10-char Apple team id
#   ASC_API_KEY_ID                — App Store Connect API key id
#   ASC_API_KEY_ISSUER_ID         — App Store Connect API issuer id
#   PLAY_SERVICE_ACCOUNT_BASE64   — base64 of the Play service-account JSON
#
# Apple/Google signing CREDENTIALS (the actual cert + keystore) are managed
# by EAS itself — run `eas credentials` once locally to set them up, or let
# `eas build` generate + store them on first run.

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        type: choice
        options: [all, ios, android]
        default: all
      submit:
        description: 'Submit to the stores after building'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  build-submit:
    name: EAS build + submit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install eas-cli
        run: npm install -g eas-cli

      # apps/mobile is intentionally NOT a pnpm workspace member (EAS Cloud
      # can't resolve workspace deps) — it has its own package-lock.json.
      - name: Install deps
        run: npm ci

      - name: Restore submit credentials from secrets
        if: ${{ github.event_name == 'push' || inputs.submit }}
        run: |
          mkdir -p credentials
          echo "${{ secrets.ASC_API_KEY_BASE64 }}"          | base64 -d > credentials/asc-api-key.p8
          echo "${{ secrets.PLAY_SERVICE_ACCOUNT_BASE64 }}" | base64 -d > credentials/play-service-account.json

      # eas.json signs Android with credentialsSource: local, so the upload
      # keystore has to be on this runner — same step as mobile-build.yml.
      - name: Restore Android upload keystore from secrets
        if: ${{ inputs.platform != 'ios' }}
        env:
          ANDROID_KEYSTORE_BASE64:   ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set"; exit 1; }
          done
          mkdir -p credentials
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > credentials/android-upload.jks
          node -e "require('fs').writeFileSync('credentials.json',JSON.stringify({android:{keystore:{keystorePath:'credentials/android-upload.jks',keystorePassword:process.env.ANDROID_KEYSTORE_PASSWORD,keyAlias:process.env.ANDROID_KEY_ALIAS,keyPassword:process.env.ANDROID_KEY_PASSWORD}}}))"

      # App Store Connect rejects a repeated CFBundleVersion ("already submitted
      # this build"). eas autoIncrement only bumps the CI checkout's app.json
      # (33 -> 34 every run, never committed), so derive a unique, monotonically
      # increasing build number from the run number instead.
      - name: Set unique iOS build number
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));j.expo.ios.buildNumber=String(100+Number(process.env.GITHUB_RUN_NUMBER));fs.writeFileSync('app.json',JSON.stringify(j,null,2));console.log('iOS buildNumber =',j.expo.ios.buildNumber)"

      # MultX bridge — off unless the repository variables MULTX_ENABLED=true,
      # MULTX_MANIFEST_URL and MULTX_MANIFEST_SHA256 are set; written into
      # the profile's env so EAS inlines them as EXPO_PUBLIC_MULTX_*.
      - name: MultX bridge settings
        env:
          MULTX_ENABLED:         ${{ vars.MULTX_ENABLED }}
          MULTX_MANIFEST_URL:    ${{ vars.MULTX_MANIFEST_URL }}
          MULTX_MANIFEST_SHA256: ${{ vars.MULTX_MANIFEST_SHA256 }}
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('eas.json','utf8'));const e=j.build.production.env||(j.build.production.env={});e.EXPO_PUBLIC_MULTX_ENABLED=process.env.MULTX_ENABLED||'false';e.EXPO_PUBLIC_MULTX_MANIFEST_URL=process.env.MULTX_MANIFEST_URL||'';e.EXPO_PUBLIC_MULTX_MANIFEST_SHA256=process.env.MULTX_MANIFEST_SHA256||'';fs.writeFileSync('eas.json',JSON.stringify(j,null,2));console.log('MultX bridge',e.EXPO_PUBLIC_MULTX_ENABLED==='true'?'on':'off')"
      - name: Build (and submit) via EAS
        env:
          EXPO_TOKEN:            ${{ secrets.EXPO_TOKEN }}
          ASC_APPLE_ID:          ${{ secrets.ASC_APPLE_ID }}
          ASC_APP_ID:            ${{ secrets.ASC_APP_ID }}
          APPLE_TEAM_ID:         ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_ID:        ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
        run: |
          PLATFORM="${{ inputs.platform || 'all' }}"
          SUBMIT="${{ github.event_name == 'push' && 'true' || inputs.submit }}"
          if [ "$SUBMIT" = "true" ]; then
            # --auto-submit chains `eas submit` to each finished build using
            # the submit.production profile in eas.json.
            eas build --platform "$PLATFORM" --profile production --non-interactive --auto-submit
          else
            eas build --platform "$PLATFORM" --profile production --non-interactive
          fi
