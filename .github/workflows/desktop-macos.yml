# Desktop macOS build — the Electron app compiled, signed, and notarized on
# GitHub's macOS runners (macOS Electron builds are impossible from the
# Windows dev machine; this workflow IS the project's Mac build machine).
#
# Trigger: manually (Actions tab -> "Desktop macOS build" -> Run workflow) or
# by pushing a tag like desktop-v0.2.18.
#
# Signing/notarization is OPTIONAL and driven by repo secrets — with no
# secrets set, the build completes UNSIGNED (Gatekeeper: right-click -> Open),
# which is fine for internal testing. For public distribution add:
#   CSC_LINK                       base64 of the Developer ID Application .p12
#   CSC_KEY_PASSWORD               password for that .p12
#   APPLE_ID                       Apple ID email (notarization)
#   APPLE_APP_SPECIFIC_PASSWORD    app-specific password (appleid.apple.com)
#   APPLE_TEAM_ID                  JEYAFQ92YG
# electron-builder.yml already gates hardened-runtime + notarization on these.
name: Desktop macOS build

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  build-mac:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # node-gyp needs Python's distutils to compile the native crypto deps
      # (keccak, blake-hash, tiny-secp256k1, bigint-buffer) — removed in
      # Python 3.12, which GitHub's macOS runners default to. Pin 3.11.
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer + main process
        working-directory: apps/desktop
        run: pnpm build

      # Builds BOTH architectures: Apple Silicon (arm64) + Intel (x64).
      # --publish never: artifacts are uploaded to the run, not to a release.
      # --config.productName=Thanos: the Mac app's display name is "Thanos",
      # not "Thanos Wallet" (client request, macOS only — Windows/Linux keep
      # the electron-builder.yml default).
      - name: Package .dmg + .zip
        working-directory: apps/desktop
        run: |
          # A GitHub secret that isn't configured arrives as an EMPTY STRING,
          # not unset. electron-builder treats an empty-but-defined CSC_LINK as
          # "a certificate was provided" and tries to read it from path "" —
          # which resolves to the cwd (apps/desktop) and fails with
          # "... not a file" (confirmed live 2026-09-17: CSC_IDENTITY_AUTO_
          # DISCOVERY=false alone does NOT fix this — that only stops the
          # keychain-search fallback, not the empty-CSC_LINK misread). When no
          # cert is present, force a clean UNSIGNED build: drop the empty vars
          # and disable keychain auto-discovery too. Same guard release.yml's
          # desktop job already uses.
          if [ -z "$CSC_LINK" ]; then
            echo "::notice::No macOS signing certificate configured — building UNSIGNED."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --mac dmg zip --arm64 --x64 --publish never --config.productName=Thanos
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thanos-desktop-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14
